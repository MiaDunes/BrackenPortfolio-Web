<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Mia Bracken</title>
    <meta name="author" content="Mia C. Bracken">
    <meta name="robots" content="noindex">
    <!-- All styles live in this file, so the page looks right even when it's
         shown at a broken address where css/style.css can't be found. -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 16px;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: rgb(190, 225, 203);
            color: rgb(30, 30, 49);
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 2em;
            margin: 1em auto 2em auto;
        }
        nav a, footer a {
            text-decoration: none;
            color: rgb(30, 30, 49);
            font-size: 1.25rem;
        }
        nav a:hover, footer a:hover { text-decoration: underline; }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1em;
        }
        .card {
            width: min(48em, 100%);
            background-color: beige;
            border-radius: 2em;
            padding: 2.5em min(2.5em, 6%);
            text-align: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 1.25em;
        }
        .code {
            margin-top: 1em;
            font-size: 1rem;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: rgb(90, 110, 70);
        }
        h1 {
            margin-top: .3em;
            font-size: 2.25rem;
            color: rgb(30, 30, 49);
        }
        .card p {
            margin-top: .8em;
            font-size: 1.25rem;
        }
        .buttons {
            margin-top: 1.75em;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1em;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            color: rgb(49, 63, 35);
            background-color: rgb(203, 219, 63);
            border: 2px solid rgb(203, 219, 63);
            padding: .75em 1.25em;
            border-radius: .3em;
        }
        .btn.secondary { background-color: transparent; }
        .btn:hover { opacity: .8; }
        footer {
            padding: 2em 0 1.5em 0;
            text-align: center;
        }
        footer a { margin: 0 1em; font-size: 1rem; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <div class="card">
            <canvas id="lost" width="900" height="360" aria-hidden="true"></canvas>
            <p class="code">Error 404</p>
            <h1>This page drifted away</h1>
            <p>The link may be broken, or the page may have moved. Everything else is still here.</p>
            <div class="buttons">
                <a class="btn" href="index.html">Back to Home</a>
                <a class="btn secondary" href="gallery.html">See the Gallery</a>
            </div>
        </div>
    </main>

    <footer>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </footer>

    <!-- Drifting bubbles with "404" in the middle. Plain canvas, no libraries,
         so nothing here can fail to load. -->
    <script>
    (function () {
        var canvas = document.getElementById("lost");
        if (!canvas || !canvas.getContext) return;
        var ctx = canvas.getContext("2d");
        var w = canvas.width, h = canvas.height;
        var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var t = 0, bubbles = [];
        for (var i = 0; i < 45; i++) {
            bubbles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: 6 + Math.random() * 26,
                speed: 0.4 + Math.random(),
                offset: Math.random() * Math.PI * 2
            });
        }
        function draw() {
            t += 0.01;
            var grad = ctx.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w * 0.7);
            grad.addColorStop(0, "rgb(255,200,220)");
            grad.addColorStop(1, "rgb(190,225,203)");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            for (var i = 0; i < bubbles.length; i++) {
                var b = bubbles[i];
                ctx.beginPath();
                ctx.fillStyle = "rgba(80, 120, 200, 0.45)";
                ctx.arc(b.x + Math.cos(t * b.speed + b.offset) * 24,
                        b.y + Math.sin(t * b.speed + b.offset) * 24, b.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = "rgba(30, 30, 49, 0.85)";
            ctx.font = "bold 150px Cambria, Georgia, serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("404", w / 2, h / 2 + 8);
            if (!still) requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>
</body>
</html>
