<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Fan Flyer</title>
<!-- Shown inside a Gallery card on gallery.html (iframe). -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;touch-action:pan-y}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;font:12px/1 monospace;color:#1d4e73;opacity:.75;pointer-events:none;letter-spacing:1px}
</style></head><body>
<canvas id="c"></canvas><div id="hint">TAP ANYWHERE TO CALL IT OVER</div>
<script>
const SPR={"pal": ["#e9763f", "#c95f2e", "#7d6a1e", "#5a4a12", "#2b2310"], "rows": ["........................................................", "........................00......................0230....", ".......................022....................00211.....", ".......................023...........00022332210000.....", "........................220........0223321100000000.....", "........................220....00233200000001111000.....", "........................02200233200...0000110000000.....", ".......................02233320.......100000000001......", "....................023332222200000002100010000001......", "................0223222232220020.....0000001111100......", "............0223200.020200200..020...1000000000000......", "........0023320....00.2.0020.0....2200000111110000......", "....0023321100...020.00.0.22.00....01000000001101.......", ".02232210000000.00..00..0.22..2....00001110000000.......", "02210000011100120...2...0.020.00..000000001110010.......", ".1000001100000010..00..00.020..2.010000000001001........", "..100110000100000002...00..22..02100011000000000........", "..0100000010000000100..0...22..0000000011000001.........", "...0000011000100000010020..22110000000001100010.........", "....000100001000000000000112210000000000000010..........", ".....1000001000100000000000122000001000000010...........", ".....010001000100001000000002200000010000010............", "......0100000100000100010000221010000100010.............", "........0000100000100010001012100100001000..............", ".........10000000010001000101220010000000...............", "..........000000010000100010022000100000................", "...........0000001000100001002200000000.................", "............00100000010000100221000010..................", "...............001000000000001210010....................", "..................0010000000012210......................", ".....................000000000220.......................", "..............................020.......................", "..............................022.......................", "...............................23.......................", "...............................220......................", "...............................220......................", "...............................022......................", "...............................023......................", "................................220.....................", "................................222.....................", "...............................03233222000..............", "..............................0232220..0222220..........", "............................0200222002.0000010..........", "...........................00..00220002001110...........", ".........................0210.0.00202.0100000...........", "........................0210100.202000001101............", ".......................21010010.2.2201010010............", ".......................01000100110221101101.............", "........................010101101022101001..............", ".........................0000101011211110...............", "..........................01010101122010................", "............................0001010220..................", "................................000222..................", "...................................022..................", "...................................023..................", "....................................220.................", "....................................222.................", "....................................022.................", "....................................0230................", ".....................................23.................", ".....................................0..................", "........................................................", "........................................................"]};
const c=document.getElementById('c'),x=c.getContext('2d');
const PX=2; // world pixel size (smaller, to fit a Gallery card)
let W,H;
function size(){W=Math.ceil(innerWidth/PX);H=Math.ceil(innerHeight/PX);c.width=W;c.height=H;x.imageSmoothingEnabled=false}
addEventListener('resize',size);size();

// build sprite
const sw=SPR.rows[0].length,sh=SPR.rows.length;
const sp=document.createElement('canvas');sp.width=sw;sp.height=sh;
const sx=sp.getContext('2d');
SPR.rows.forEach((r,y)=>[...r].forEach((ch,i)=>{if(ch!=='.'){sx.fillStyle=SPR.pal[+ch];sx.fillRect(i,y,1,1)}}));

// pixel clouds
const clouds=[...Array(6)].map(()=>({x:Math.random()*W,y:Math.random()*H*0.8,w:14+Math.random()*22|0,s:.04+Math.random()*.08}));
function cloud(cl){
  x.fillStyle='#ffffff';
  const h=Math.max(4,cl.w/3|0);
  x.fillRect(cl.x|0,(cl.y+h/2)|0,cl.w,h/2|0);
  x.fillRect((cl.x+cl.w*.2)|0,(cl.y+h/4)|0,cl.w*.6|0,h/2|0);
  x.fillRect((cl.x+cl.w*.35)|0,cl.y|0,cl.w*.3|0,h/2|0);
}

// flyer
const f={x:W/2,y:H/2,vx:.6,vy:0,tx:W*.8,ty:H*.3,dir:1,t:0,a:0};
function newTarget(){f.tx=sw/2+Math.random()*(W-sw);f.ty=sh/2+Math.random()*(H-sh)}
newTarget();
let manual=0;
c.addEventListener('pointerdown',e=>{f.tx=e.clientX/PX;f.ty=e.clientY/PX;manual=90;
  for(let i=0;i<14;i++)sparks.push({x:f.tx,y:f.ty,vx:(Math.random()-.5)*1.4,vy:(Math.random()-.5)*1.4,l:30})});
const trail=[],sparks=[];

function step(){
  f.t++;
  const dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy);
  if(d<10&&manual<=0)newTarget();
  if(manual>0)manual--;
  const max=manual>0?1.6:.9;
  f.vx+=dx/d*.04;f.vy+=dy/d*.04;
  f.vy+=Math.sin(f.t*.05)*.01;
  const sp=Math.hypot(f.vx,f.vy);if(sp>max){f.vx*=max/sp;f.vy*=max/sp}
  f.x+=f.vx;f.y+=f.vy;
  if(Math.abs(f.vx)>.15)f.dir=f.vx>0?1:-1;
  f.a+=((f.vy*.35+f.vx*.08*f.dir)-f.a)*.08;
  if(f.t%3===0)trail.push({x:f.x,y:f.y+sh*.35,l:40});
  clouds.forEach(cl=>{cl.x+=cl.s;if(cl.x>W)cl.x=-cl.w});
}
function draw(){
  x.fillStyle='#8fd3ff';x.fillRect(0,0,W,H);
  x.fillStyle='#a9ddff';for(let y=H*.55|0;y<H;y+=6)x.fillRect(0,y,W,3);
  clouds.forEach(cloud);
  trail.forEach(p=>{x.fillStyle=`rgba(255,255,255,${p.l/60})`;x.fillRect(p.x|0,p.y|0,1,1);p.l--});
  while(trail.length&&trail[0].l<=0)trail.shift();
  sparks.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l--;x.fillStyle=p.l%6<3?'#fff6a8':'#e9763f';x.fillRect(p.x|0,p.y|0,1,1)});
  for(let i=sparks.length-1;i>=0;i--)if(sparks[i].l<=0)sparks.splice(i,1);
  // shadow-free sprite with flutter
  const flap=1+Math.sin(f.t*.3)*.07;
  x.save();
  x.translate(Math.round(f.x),Math.round(f.y));
  x.rotate(Math.round(f.a*8)/8*f.dir); // stepped rotation keeps it chunky
  x.scale(f.dir*flap,1/flap);
  x.drawImage(sp,-sw/2|0,-sh/2|0);
  x.restore();
}
(function loop(){step();draw();requestAnimationFrame(loop)})();
</script></body></html>
